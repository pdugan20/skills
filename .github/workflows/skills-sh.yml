name: Skills.sh freshness

on:
  schedule:
    - cron: "19 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Check skills.sh catalog and audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Compare catalog with repository
        run: uv run --locked python scripts/check_skills_sh.py

      - name: Compare security audits with reviewed policy
        run: uv run --locked python scripts/check_skills_sh_security.py
