name: Release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required only for creating the tagged GitHub release.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          # Release builds start from a clean environment.
          enable-cache: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.5"
          cache: false

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked
          go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.5.6

      - name: Validate release and repository
        run: |
          uv run --locked python scripts/validate_repository.py --release-tag "$GITHUB_REF_NAME"
          npm run verify
          npm run validate:external

      - name: Package plugin
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/patrick-skills-$GITHUB_REF_NAME.zip" HEAD

      - name: Extract curated release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --locked python scripts/release_notes.py "$version" --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/patrick-skills-$GITHUB_REF_NAME.zip" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
