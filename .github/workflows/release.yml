name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: npm ci

      - name: Validate release and repository
        run: |
          python3 scripts/validate_repository.py --release-tag "$GITHUB_REF_NAME"
          npm run verify

      - name: Package plugin
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/patrick-workflows-$GITHUB_REF_NAME.zip" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/patrick-workflows-$GITHUB_REF_NAME.zip" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
