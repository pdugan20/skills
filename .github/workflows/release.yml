name: Release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required only for creating the tagged GitHub release.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version-file: .python-version

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.5"
          cache: false

      - name: Install dependencies
        run: |
          npm ci
          go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.5.6

      - name: Validate release and repository
        run: |
          python3 scripts/validate_repository.py --release-tag "$GITHUB_REF_NAME"
          npm run verify
          npm run validate:external

      - name: Package plugin
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/patrick-workflows-$GITHUB_REF_NAME.zip" HEAD

      - name: Extract curated release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$version" --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/patrick-workflows-$GITHUB_REF_NAME.zip" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
