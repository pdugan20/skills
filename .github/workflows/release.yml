name: Release

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required only for creating the tagged GitHub release.
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository tooling
        uses: ./.github/actions/setup-repository
        with:
          # Release builds start from a clean environment, without npm or uv caches.
          cache: "false"

      - name: Validate release and repository
        run: |
          uv run --locked python scripts/validate_repository.py --release-tag "$GITHUB_REF_NAME"
          npm run verify
          npm run validate:external

      - name: Package plugin
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/patrick-skills-$GITHUB_REF_NAME.zip" HEAD

      - name: Extract curated release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --locked python scripts/release_notes.py "$version" --output "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/patrick-skills-$GITHUB_REF_NAME.zip" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
